name: Validate Palesya native print loader

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag privato immutabile da verificare"
        required: true
        type: string
      expected_source_commit:
        description: "Commit sorgente atteso"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: palesya-native-print-loader-${{ inputs.expected_source_commit }}
  cancel-in-progress: false

jobs:
  validate-loader:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private Palesya source
        uses: actions/checkout@v5
        with:
          repository: palesya-app/palesya
          ref: ${{ inputs.release_tag }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Verify immutable source commit
        shell: pwsh
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
        run: |
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $expected = $env:EXPECTED_SOURCE_COMMIT.Trim().ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Commit sorgente inatteso: $actual"
          }

      - name: Set up Python x64
        id: python-x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Exercise TOM RTF loader with fail-closed timeout
        shell: pwsh
        run: |
          $code = @'
          import ctypes
          import os
          import threading
          from ctypes import wintypes

          import native_registration_print as native_print

          def abort_hung_loader():
              print("Windows TOM RTF loader TIMEOUT", flush=True)
              os._exit(124)

          timeout = threading.Timer(60, abort_hung_loader)
          timeout.daemon = True
          timeout.start()

          ctypes.WinDLL("Msftedit.dll")
          user32 = ctypes.WinDLL("user32", use_last_error=True)
          kernel32 = ctypes.WinDLL("kernel32", use_last_error=True)
          ole32 = ctypes.WinDLL("ole32", use_last_error=True)
          user32.CreateWindowExW.argtypes = [
              wintypes.DWORD, wintypes.LPCWSTR, wintypes.LPCWSTR, wintypes.DWORD,
              ctypes.c_int, ctypes.c_int, ctypes.c_int, ctypes.c_int,
              wintypes.HWND, wintypes.HMENU, wintypes.HINSTANCE, ctypes.c_void_p,
          ]
          user32.CreateWindowExW.restype = wintypes.HWND
          user32.SendMessageW.argtypes = [
              wintypes.HWND, wintypes.UINT, ctypes.c_size_t, ctypes.c_ssize_t,
          ]
          user32.SendMessageW.restype = ctypes.c_ssize_t
          user32.DestroyWindow.argtypes = [wintypes.HWND]
          user32.DestroyWindow.restype = wintypes.BOOL
          kernel32.GetModuleHandleW.argtypes = [wintypes.LPCWSTR]
          kernel32.GetModuleHandleW.restype = wintypes.HMODULE
          ole32.OleInitialize.argtypes = [ctypes.c_void_p]
          ole32.OleInitialize.restype = ctypes.c_long
          ole32.OleUninitialize.argtypes = []

          ole_result = int(ole32.OleInitialize(None))
          hwnd = None
          try:
              print("Windows TOM RTF loader: CreateWindow START", flush=True)
              hwnd = user32.CreateWindowExW(
                  0, "RICHEDIT50W", "", 0x80000000 | 0x0004,
                  0, 0, 1, 1, 0, 0, kernel32.GetModuleHandleW(None), None,
              )
              if not hwnd:
                  raise RuntimeError("RICHEDIT50W non inizializzato")
              print("Windows TOM RTF loader: CreateWindow PASS", flush=True)
              payload = (
                  br"{\rtf1\ansi\deff0{\fonttbl{\f0 Arial;}}"
                  br"\fs24 Domanda di iscrizione Palesya\par}"
              )
              print("Windows TOM RTF loader: Open START", flush=True)
              native_print._load_rtf_with_windows_tom(hwnd, payload, user32)
              print("Windows TOM RTF loader: Open PASS", flush=True)
              length = int(user32.SendMessageW(hwnd, 0x000E, 0, 0))
              if length <= 0:
                  raise RuntimeError("RTF caricato senza testo")
              print(f"Windows TOM RTF loader PASS: text_length={length}", flush=True)
          finally:
              timeout.cancel()
              if hwnd:
                  user32.DestroyWindow(hwnd)
              if ole_result in (0, 1):
                  ole32.OleUninitialize()
          '@
          & "${{ steps.python-x64.outputs.python-path }}" -c $code
          if ($LASTEXITCODE -ne 0) {
            throw "Caricamento RTF TOM non superato (exit $LASTEXITCODE)."
          }

      - name: Locate full native print blocking boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Service -Name Spooler -StartupType Manual
          Start-Service -Name Spooler
          $printerName = 'Palesya Native Print Diagnostic'
          $outputPath = Join-Path $env:RUNNER_TEMP 'palesya-native-print-diagnostic.prn'
          $driver = Get-PrinterDriver | Where-Object Name -eq 'Microsoft Print To PDF' | Select-Object -First 1
          if (-not $driver) { throw 'Microsoft Print To PDF non disponibile.' }
          Remove-Item -LiteralPath $outputPath -Force -ErrorAction SilentlyContinue
          Add-PrinterPort -Name $outputPath
          Add-Printer -Name $printerName -DriverName $driver.Name -PortName $outputPath
          try {
            & rundll32.exe printui.dll,PrintUIEntry /y /n $printerName
            $code = @'
          import ctypes
          import os
          import threading
          from ctypes import wintypes

          import native_registration_print as native_print

          def abort_hung_print():
              print("Windows full native print TIMEOUT", flush=True)
              os._exit(124)

          timeout = threading.Timer(90, abort_hung_print)
          timeout.daemon = True
          timeout.start()
          real_windll = ctypes.WinDLL
          real_load_rtf = native_print._load_rtf_with_windows_tom
          native_comdlg32 = real_windll("comdlg32", use_last_error=True)
          native_print_dialog = native_comdlg32.PrintDlgW
          native_print_dialog.argtypes = [ctypes.c_void_p]
          native_print_dialog.restype = wintypes.BOOL

          def logged_load_rtf(*args, **kwargs):
              print("Windows full native print: TOM START", flush=True)
              result = real_load_rtf(*args, **kwargs)
              print("Windows full native print: TOM PASS", flush=True)
              return result

          def print_dialog_without_ui(pointer):
              print_dialog = getattr(pointer, "_obj", None)
              if print_dialog is None:
                  raise RuntimeError("PRINTDLG pointer non verificabile")
              print_dialog.Flags |= 0x00000400
              print("Windows full native print: PrintDlg START", flush=True)
              result = native_print_dialog(pointer)
              print("Windows full native print: PrintDlg PASS", flush=True)
              return result

          print_dialog_without_ui.argtypes = None
          print_dialog_without_ui.restype = None

          class Comdlg32Proxy:
              def __getattr__(self, name):
                  if name == "PrintDlgW":
                      return print_dialog_without_ui
                  return getattr(native_comdlg32, name)

          def diagnostic_windll(name, *args, **kwargs):
              if str(name).casefold() in {"comdlg32", "comdlg32.dll"}:
                  return Comdlg32Proxy()
              return real_windll(name, *args, **kwargs)

          ctypes.WinDLL = diagnostic_windll
          native_print._load_rtf_with_windows_tom = logged_load_rtf
          payload = (
              br"{\rtf1\ansi\deff0{\fonttbl{\f0 Arial;}}"
              br"\paperw8391\paperh11907\margl720\margr720\margt720\margb720"
              br"\fs24 Domanda di iscrizione Palesya\par}"
          )
          try:
              print("Windows full native print START", flush=True)
              result = native_print._print_rtf_with_windows(payload)
              print(f"Windows full native print PASS: {result}", flush=True)
          finally:
              timeout.cancel()
              ctypes.WinDLL = real_windll
              native_print._load_rtf_with_windows_tom = real_load_rtf
          '@
            & "${{ steps.python-x64.outputs.python-path }}" -c $code
            if ($LASTEXITCODE -ne 0) {
              throw "Stampa nativa diagnostica non superata (exit $LASTEXITCODE)."
            }
          }
          finally {
            Remove-Printer -Name $printerName -ErrorAction SilentlyContinue
            Remove-PrinterPort -Name $outputPath -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $outputPath -Force -ErrorAction SilentlyContinue
          }
