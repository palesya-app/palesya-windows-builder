name: Build Palesya Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag privato da compilare (es. v1.2.0-pilot.41)"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: palesya-windows-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout private Palesya source
        uses: actions/checkout@v5
        with:
          repository: palesya-app/palesya
          ref: ${{ inputs.release_tag || github.ref_name }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 0

      - name: Record private source commit
        shell: pwsh
        run: |
          $sourceCommit = (git rev-parse HEAD).Trim()
          "PALESYA_SOURCE_COMMIT=$sourceCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          [System.IO.File]::WriteAllText("source-commit.txt", "$sourceCommit`n", [System.Text.Encoding]::ASCII)
          Write-Host "Building private source commit $sourceCommit"

      - name: Set up Python x64
        id: python-x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip

      - name: Preserve release contract bytes across Windows checkout
        shell: pwsh
        run: |
          # Read the immutable blob directly from Git and write its raw bytes.
          # This avoids CRLF working-tree conversion without weakening the hash.
          & "${{ steps.python-x64.outputs.python-path }}" -c "import pathlib, subprocess; pathlib.Path(r'release-train/regression-contract.json').write_bytes(subprocess.check_output(['git', 'show', 'HEAD:release-train/regression-contract.json']))"
          if ($LASTEXITCODE -ne 0) { throw 'Ripristino byte contratto non riuscito' }
          Get-FileHash release-train\regression-contract.json -Algorithm SHA256

      - name: Verify closed release train
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v1\.2\.0-pilot\.(\d+)$') {
            throw "Tag release non valido: $env:RELEASE_TAG"
          }
          $build = [int]$Matches[1]
          if ($build -le 219) {
            Write-Host "Release storica $env:RELEASE_TAG: gate non applicabile"
          } else {
            if (-not (Test-Path 'scripts\release_train.py')) {
              throw 'Gate release train assente nel sorgente privato'
            }
            & "${{ steps.python-x64.outputs.python-path }}" scripts\release_train.py verify `
              --version $env:RELEASE_TAG --require-tag
            if ($LASTEXITCODE -ne 0) { throw 'Release train non verificato' }
          }

      - name: Install build dependencies
        shell: pwsh
        run: |
          & "${{ steps.python-x64.outputs.python-path }}" -m pip install --upgrade pip
          & "${{ steps.python-x64.outputs.python-path }}" -m pip install -r requirements-dev.txt

      - name: Set up Python x86 for legacy RFID bridge
        id: python-x86
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x86"

      - name: Install x86 bridge build dependency
        shell: pwsh
        run: '& "${{ steps.python-x86.outputs.python-path }}" -m pip install "pyinstaller>=6.12,<7"'

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup 6 non disponibile sul runner."
          }

      - name: Build Windows installer
        shell: pwsh
        env:
          PALESYA_VERSION: ${{ inputs.release_tag || github.ref_name }}
          PALESYA_MAIN_PYTHON: ${{ steps.python-x64.outputs.python-path }}
          PALESYA_BRIDGE_PYTHON: ${{ steps.python-x86.outputs.python-path }}
          PALESYA_REQUIRE_X86_BRIDGE: "1"
        run: .\packaging\build_windows.ps1 -SkipManifest

      - name: Smoke test installer and installed application
        shell: pwsh
        env:
          PALESYA_VERSION: ${{ inputs.release_tag || github.ref_name }}
          PALESYA_MAIN_PYTHON: ${{ steps.python-x64.outputs.python-path }}
        run: .\scripts\test_windows_payload.ps1 -SkipManifest

      - name: Exercise native RTF printing on disposable Windows printer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Service -Name Spooler -StartupType Manual
          Start-Service -Name Spooler
          $printerName = 'Palesya Native Print QA'
          $outputPath = Join-Path $env:RUNNER_TEMP 'palesya-native-registration-print.prn'
          $driver = Get-PrinterDriver | Where-Object Name -eq 'Microsoft Print To PDF' | Select-Object -First 1
          if (-not $driver) {
            $driver = Get-PrinterDriver | Where-Object Name -eq 'Generic / Text Only' | Select-Object -First 1
          }
          if (-not $driver) { throw 'Nessun driver di stampa Windows verificabile disponibile.' }
          Remove-Item -LiteralPath $outputPath -Force -ErrorAction SilentlyContinue
          Add-PrinterPort -Name $outputPath
          Add-Printer -Name $printerName -DriverName $driver.Name -PortName $outputPath
          try {
            & rundll32.exe printui.dll,PrintUIEntry /y /n $printerName
            $code = @'
          import ctypes
          import threading
          import time
          from ctypes import wintypes
          import native_registration_print as native_print

          user32 = ctypes.WinDLL("user32", use_last_error=True)
          ENUM_WINDOWS = ctypes.WINFUNCTYPE(wintypes.BOOL, wintypes.HWND, wintypes.LPARAM)
          BM_CLICK = 0x00F5
          clicked = threading.Event()

          user32.EnumWindows.argtypes = [ENUM_WINDOWS, wintypes.LPARAM]
          user32.EnumWindows.restype = wintypes.BOOL
          user32.EnumChildWindows.argtypes = [wintypes.HWND, ENUM_WINDOWS, wintypes.LPARAM]
          user32.EnumChildWindows.restype = wintypes.BOOL
          user32.GetClassNameW.argtypes = [wintypes.HWND, wintypes.LPWSTR, ctypes.c_int]
          user32.GetClassNameW.restype = ctypes.c_int
          user32.GetDlgCtrlID.argtypes = [wintypes.HWND]
          user32.GetDlgCtrlID.restype = ctypes.c_int
          user32.IsWindowEnabled.argtypes = [wintypes.HWND]
          user32.IsWindowEnabled.restype = wintypes.BOOL
          user32.SendMessageW.argtypes = [wintypes.HWND, wintypes.UINT, wintypes.WPARAM, wintypes.LPARAM]
          # LRESULT is pointer-sized. Python 3.12 does not expose it from
          # ctypes.wintypes on every Windows runner image.
          user32.SendMessageW.restype = ctypes.c_ssize_t

          def accept_print_dialog():
              deadline = time.monotonic() + 30
              while time.monotonic() < deadline and not clicked.is_set():
                  dialogs = []

                  @ENUM_WINDOWS
                  def collect(hwnd, _param):
                      class_name = ctypes.create_unicode_buffer(64)
                      user32.GetClassNameW(hwnd, class_name, len(class_name))
                      if class_name.value == "#32770":
                          dialogs.append(hwnd)
                      return True

                  user32.EnumWindows(collect, 0)
                  for dialog in dialogs:
                      buttons = []

                      @ENUM_WINDOWS
                      def collect_button(hwnd, _param):
                          if user32.GetDlgCtrlID(hwnd) == 1 and user32.IsWindowEnabled(hwnd):
                              buttons.append(hwnd)
                          return True

                      user32.EnumChildWindows(dialog, collect_button, 0)
                      if buttons:
                          user32.SendMessageW(buttons[0], BM_CLICK, 0, 0)
                          clicked.set()
                          return
                  time.sleep(0.1)

          worker = threading.Thread(target=accept_print_dialog, daemon=True)
          worker.start()
          payload = (
              br"{\rtf1\ansi\deff0{\fonttbl{\f0 Arial;}}"
              br"\paperw8391\paperh11907\margl720\margr720\margt720\margb720"
              br"\fs24\b Domanda di iscrizione Palesya\b0\par"
              br"Nome e cognome: Mario Rossi\par Codice fiscale: RSSMRA80A01H501U\par}"
          )
          outcome = native_print._print_rtf_with_windows(payload)
          worker.join(timeout=5)
          assert clicked.is_set(), "Il dialogo nativo di stampa non e comparso"
          assert outcome == "printed", outcome
          print("Windows native RTF print PASS")
          '@
            & "${{ steps.python-x64.outputs.python-path }}" -c $code
            if ($LASTEXITCODE -ne 0) { throw 'Stampa RTF nativa Windows non superata.' }
            $deadline = (Get-Date).AddSeconds(20)
            while ((Get-Date) -lt $deadline -and -not (Test-Path $outputPath)) {
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path $outputPath)) { throw 'Il driver Windows non ha prodotto il documento di collaudo.' }
            if ((Get-Item $outputPath).Length -le 0) { throw 'Documento di collaudo stampa vuoto.' }
          }
          finally {
            Remove-Printer -Name $printerName -ErrorAction SilentlyContinue
            Remove-PrinterPort -Name $outputPath -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $outputPath -Force -ErrorAction SilentlyContinue
          }

      - name: Exercise real Qwen model under Windows resource guard
        shell: pwsh
        run: |
          & "${{ steps.python-x64.outputs.python-path }}" -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser di collaudo AI non installato.' }
          $result = & "${{ steps.python-x64.outputs.python-path }}" -c "import os,runpy; os.environ['GITHUB_REPOSITORY']='palesya-app/palesya'; runpy.run_path(r'scripts/test_windows_ai_priority.py', run_name='__main__')" 2>&1
          $result | Write-Host
          if ($LASTEXITCODE -ne 0) { throw 'Modello AI reale Windows non superato.' }
          if (($result -join "`n") -notmatch '"windows_frozen_real_model":\s*"PASS"') {
            throw 'Il test AI non ha eseguito una conversazione reale sotto il Job Object.'
          }

      - name: Verify artifact source commit
        shell: pwsh
        run: |
          $expected = (Get-Content source-commit.txt -Raw).Trim()
          $buildInfo = Get-Content packaging\build-info.json -Raw | ConvertFrom-Json
          if ($buildInfo.source_commit -ne $expected) {
            throw "Build info non allineato al commit sorgente."
          }

      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: Palesya-windows-x64-${{ inputs.release_tag || github.ref_name }}
          path: |
            dist/PalesyaSetup.exe
            dist/PalesyaSetup.exe.sha256
            source-commit.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish verified public download
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $assets = @("dist\PalesyaSetup.exe", "dist\PalesyaSetup.exe.sha256", "source-commit.txt")
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag @assets --repo $env:GITHUB_REPOSITORY `
              --title "Palesya Windows $tag" `
              --notes "Installer Windows verificato dal commit privato indicato in source-commit.txt."
          }

  build-macos:
    # macOS viene gia compilato, firmato e pubblicato dal workflow privato
    # Palesya Desktop Release. Il builder pubblico resta dedicato a Windows,
    # evitando code duplicate sul runner Mac self-hosted.
    if: ${{ false }}
    needs: build-windows
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-arm64, macos-x64]
    # Il runner Mac e self-hosted: la pubblicazione rimane gratuita e il
    # repository pubblico riceve solo i pacchetti compilati, mai i sorgenti.
    runs-on: [self-hosted, palesya, macos-arm64]
    timeout-minutes: 45
    steps:
      - name: Checkout private Palesya source
        uses: actions/checkout@v5
        with:
          repository: palesya-app/palesya
          ref: ${{ inputs.release_tag || github.ref_name }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1

      - name: Build verified macOS package
        env:
          PALESYA_VERSION: ${{ inputs.release_tag || github.ref_name }}
          PALESYA_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-venv
          if [ "$PALESYA_PLATFORM" = "macos-x64" ]; then
            /usr/bin/arch -x86_64 /usr/bin/python3 -m venv .release-venv
            run_python() { /usr/bin/arch -x86_64 .release-venv/bin/python "$@"; }
          else
            /usr/bin/python3 -m venv .release-venv
            run_python() { .release-venv/bin/python "$@"; }
          fi
          run_python -m pip install --upgrade pip
          run_python -m pip install -r requirements-dev.txt
          run_python packaging/write_build_info.py
          run_python -m PyInstaller --noconfirm --clean packaging/Palesya.spec
          run_python -m PyInstaller --noconfirm --clean packaging/PalesyaUpdater.spec
          cp dist/PalesyaUpdater dist/Palesya.app/Contents/MacOS/PalesyaUpdater
          codesign --force --deep --sign - dist/Palesya.app
          codesign --verify --deep --strict dist/Palesya.app
          ditto -c -k --sequesterRsrc --keepParent dist/Palesya.app "dist/Palesya-${PALESYA_PLATFORM}.zip"
          (cd dist && shasum -a 256 "Palesya-${PALESYA_PLATFORM}.zip" > "Palesya-${PALESYA_PLATFORM}.zip.sha256")

      - name: Upload verified macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Palesya-${{ matrix.platform }}-${{ inputs.release_tag || github.ref_name }}
          path: |
            dist/Palesya-${{ matrix.platform }}.zip
            dist/Palesya-${{ matrix.platform }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish verified public macOS download
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          PALESYA_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          gh release upload "$tag" \
            "dist/Palesya-${PALESYA_PLATFORM}.zip" \
            "dist/Palesya-${PALESYA_PLATFORM}.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
