name: Validate Windows document renderer

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Exact private source SHA to test without publishing or installing"
        required: true
        type: string

permissions:
  contents: read

jobs:
  document-validation:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Validate immutable reference
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          if ($env:SOURCE_COMMIT -notmatch '^[a-f0-9]{40}$') { throw 'Invalid source SHA' }
      - uses: actions/checkout@v5
        with:
          repository: palesya-app/palesya
          ref: ${{ inputs.source_commit }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test synthetic RTF on actual Windows without Office
        shell: pwsh
        run: |
          python -m pip install --quiet reportlab Pillow pypdf
          if ($LASTEXITCODE -ne 0) { throw 'Dependencies unavailable' }
          python -c "import windows_rtf_pdf; assert windows_rtf_pdf.self_test(), 'Native Windows document rendering failed'; print('Native PDF text, table and logo verified')"
          if ($LASTEXITCODE -ne 0) { throw 'Document renderer failed' }
      - name: Test additive schema and financial migrations on native Windows
        shell: pwsh
        run: |
          python -m pip install --quiet -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw 'Test dependencies unavailable' }
          python -m pytest -q `
            tests/test_schema_fast_start.py `
            tests/test_migration.py `
            tests/regression_contracts/test_operational_configuration_schema_repair.py `
            tests/regression_contracts/test_piero_fee_receipt_corrections.py `
            --maxfail=1
          if ($LASTEXITCODE -ne 0) {
            throw 'Native Windows schema or financial migration validation failed'
          }
